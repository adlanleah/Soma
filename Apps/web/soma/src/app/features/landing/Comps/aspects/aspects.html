<section id="features" class="relative py-20 md:py-32">
      <div class="mx-auto max-w-7xl px-6">

        <!-- Section header -->
        <div class="mx-auto mb-16 max-w-2xl text-center">
          <p class="mb-4 text-sm font-medium text-primary">Platform Features</p>
          <h2 class="mb-4 text-balance text-3xl font-bold tracking-tight text-base-content md:text-4xl">
            Everything you need for visual learning
          </h2>
          <p class="text-pretty text-base-content/60">
            Powerful AI tools designed specifically for educational environments,
            with safety and curriculum alignment at the core.
          </p>
        </div>

        <!-- Feature cards grid -->
        <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
          @for (feature of features(); track feature.title) {
            <div class="card bg-base-200 border border-base-300 transition-all hover:border-primary/30 hover:shadow-lg hover:shadow-primary/5">
              <div class="card-body">
                <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-lg" [class]="feature.bgColor">
                  <svg [lucideIcon]="feature.icon" class="h-6 w-6" [class]="feature.color"></svg>
                </div>
                <h3 class="card-title text-base text-base-content">{{ feature.title }}</h3>
                <p class="text-sm text-base-content/60">{{ feature.description }}</p>
              </div>
            </div>
          }
        </div>

      </div>
    </section>
